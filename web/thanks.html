<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感謝你 · Vylo</title>
<style>
  :root {
    --gold-1: #ffe259;
    --gold-2: #ffa751;
    --text: #f5f3ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    overflow-x: hidden;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .45;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb.a { width: 42vmax; height: 42vmax; right: -12vmax; top: -14vmax; background: #00c9a7; }
  .orb.b { width: 36vmax; height: 36vmax; left: -10vmax; bottom: -12vmax; background: #7b2ff7; animation-delay: -6s; animation-duration: 22s; }
  .orb.c { width: 22vmax; height: 22vmax; right: 28vw; bottom: -8vmax; background: #f107a3; animation-delay: -12s; animation-duration: 26s; }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(-6vmax, 4vmax, 0) scale(1.15); }
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: clamp(2.2rem, 6vw, 4.5rem) clamp(1.6rem, 5vw, 4rem);
    border-radius: 24px;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    max-width: min(92vw, 560px);
  }

  .emoji-big {
    font-size: clamp(3rem, 10vw, 4.5rem);
    line-height: 1;
    margin-bottom: .5em;
    animation: bounce 1.8s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  h1 {
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    font-weight: 800;
    margin-bottom: .5em;
  }
  h1 .hl {
    background: linear-gradient(90deg, var(--gold-1), var(--gold-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    font-size: clamp(.95rem, 2.6vw, 1.15rem);
    color: rgba(245, 243, 255, .75);
    margin-bottom: clamp(1.8rem, 5vw, 2.6rem);
  }

  .btn {
    display: inline-block;
    text-decoration: none;
    font-size: clamp(1.05rem, 3.2vw, 1.35rem);
    font-weight: 800;
    color: #2b1d00;
    padding: .95em 2.4em;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    box-shadow: 0 10px 34px rgba(255, 167, 81, .45), inset 0 2px 6px rgba(255, 255, 255, .65);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover  { transform: translateY(-3px) scale(1.04); }
  .btn:active { transform: translateY(0) scale(.97); }

  .home {
    display: inline-block;
    margin-top: 1.4rem;
    color: rgba(245, 243, 255, .55);
    font-size: clamp(.85rem, 2.4vw, .95rem);
    text-decoration: none;
    border-bottom: 1px dashed rgba(245, 243, 255, .35);
    padding-bottom: .15em;
    transition: color .18s ease;
  }
  .home:hover { color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .orb, .emoji-big { animation: none; }
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <main class="card">
    <div class="emoji-big">🎉</div>
    <h1>非常感謝你的<span class="hl">支持</span>！</h1>
    <p class="sub">你的每一次點擊，都是讓我繼續創作的動力。<br>想再幫忙的話，下面的按鈕隨時歡迎你 😊</p>
    <a class="btn" href="/go">💖 再幫點一次</a>
    <br>
    <a class="home" href="/">回首頁</a>
  </main>
</body>
</html>
