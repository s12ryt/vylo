<style>
  :root {
    --gold-1: #ffe259;
    --gold-2: #ffa751;
    --text: #f5f3ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    overflow-x: hidden;
  }

  /* 漂浮光球背景 */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .45;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb.a { width: 42vmax; height: 42vmax; left: -12vmax; top: -14vmax; background: #7b2ff7; }
  .orb.b { width: 36vmax; height: 36vmax; right: -10vmax; bottom: -12vmax; background: #f107a3; animation-delay: -6s; animation-duration: 22s; }
  .orb.c { width: 24vmax; height: 24vmax; left: 30vw; bottom: -8vmax; background: #00c9a7; animation-delay: -12s; animation-duration: 26s; }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(6vmax, 4vmax, 0) scale(1.15); }
  }

  /* 玻璃卡片 */
  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: clamp(2.2rem, 6vw, 4.5rem) clamp(1.6rem, 5vw, 4rem);
    border-radius: 24px;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    max-width: min(92vw, 560px);
  }

  .badge {
    display: inline-block;
    font-size: clamp(.72rem, 2vw, .85rem);
    letter-spacing: .35em;
    text-transform: uppercase;
    color: #c4b5fd;
    border: 1px solid rgba(196, 181, 253, .4);
    border-radius: 999px;
    padding: .45em 1.1em .4em 1.45em;
    margin-bottom: clamp(1rem, 3vw, 1.6rem);
  }

  h1 {
    font-size: clamp(1.9rem, 6.5vw, 3.2rem);
    font-weight: 800;
    line-height: 1.25;
    margin-bottom: .6em;
  }
  h1 .hl {
    background: linear-gradient(90deg, var(--gold-1), var(--gold-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    font-size: clamp(.95rem, 2.6vw, 1.15rem);
    color: rgba(245, 243, 255, .75);
    margin-bottom: clamp(1.8rem, 5vw, 2.8rem);
  }

  /* 主按鈕 */
  .btn {
    display: inline-block;
    text-decoration: none;
    font-size: clamp(1.15rem, 3.6vw, 1.55rem);
    font-weight: 800;
    color: #2b1d00;
    padding: 1em 2.6em;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    box-shadow: 0 10px 34px rgba(255, 167, 81, .45), inset 0 2px 6px rgba(255, 255, 255, .65);
    transition: transform .18s ease, box-shadow .18s ease;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .btn:hover  { transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 44px rgba(255, 167, 81, .6), inset 0 2px 6px rgba(255,255,255,.65); }
  .btn:active { transform: translateY(0) scale(.97); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 10px 34px rgba(255, 167, 81, .45), inset 0 2px 6px rgba(255,255,255,.65); }
    50%      { box-shadow: 0 10px 52px rgba(255, 167, 81, .75), inset 0 2px 6px rgba(255,255,255,.65); }
  }

  .hint {
    margin-top: clamp(1.4rem, 4vw, 2rem);
    font-size: clamp(.72rem, 2vw, .82rem);
    color: rgba(245, 243, 255, .45);
  }

  @media (prefers-reduced-motion: reduce) {
    .orb, .btn { animation: none; }
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <main class="card">
    <span class="badge">免費支持 · 只花你幾秒</span>
    <h1>你的<span class="hl">一次點擊</span><br>就是對我的最大鼓勵</h1>
    <p class="sub">點擊下方按鈕，看完短短的廣告頁面後，<br>就能免費幫我賺一點點收益 🙏</p>
    <a class="btn" href="/go">💰 點擊幫我賺錢</a>
    <p class="hint">安全 · 免註冊 · 點幾次都沒關係</p>
  </main>
</body>
</html>
